# Kaolinite — the dissertation model as a Petra deck (P4).
#
# Translation of the mckaol kinetic Monte Carlo model (legacy/cpp-model,
# ported and parity-tested in kmc-rs) into declarative form: the 26-site
# unit cell, the 100-599 state vocabulary as named states, and the live
# reaction set (16 hydrolysis mechanisms + Al/Si adsorption/desorption)
# with the rate numbers from the legacy data.rxn.
#
# This deck encodes CORRECTED physics, not bug-for-bug parity:
#   - the forward-hydrolysis surface test is the intended 2nd-neighbor
#     rule, not the legacy nbr[6] out-of-bounds phantom (kmc-rs reform R1);
#   - R13 (405 -> 404 reverse) is restored (legacy data.rxn types the
#     product as "40100", killing the reaction and detailed balance);
#   - Al adsorption uses delta-mu(Al) (the legacy code routes it through
#     delta-mu(Si); inert here because both are -1.0);
#   - surface termination uses the as-implemented legacy map (the
#     dead-ternary wart, reform R3) because the intended map is uncertain.
# Legacy behaviors that are deliberately NOT carried: cluster removal
# (never runs in the live legacy code), diffusion and cross-cation
# reactions (permanently disabled there), and the fatal aborts when an
# environment check touches the frozen boundary (Petra excludes frozen
# sites from selectors instead).
#
# The hidden per-site `lostal` field ("which Al holds the proton" on a 410
# oxygen) is encoded as two states (pr1/pr2) addressed via the a1/a2 bond
# labels on each Si-O-Al2 oxygen's two Al bonds.
#
# State-name key (legacy code -> deck name):
#   Al:  100 empty | 101-107 l0-l6         (ligand count 0-6)
#   Si:  200 empty | 201-205 oh0-oh4       (OH count 0-4)
#   Oss (300 Si-O-Si):   300 empty | 301 br | 302 hy | 303 si1
#   Osa (400 Si-O-Al2):  400 empty | 401 br | 402 sih | 403 full
#        | 404 albr | 405 alhy | 406 sial | 407 sialh | 408 si1
#        | 409 al1 | 410 pr1/pr2 (proton on the a1/a2 Al)
#   Oaa (500 Al-OH-Al):  500 empty | 501 br | 502 hy | 503 al1

[deck]
name = "kaolinite"
comment = "dissertation kaolinite model, corrected physics, legacy rate numbers"

[[species]]
name = "Al"
charge = 3.0

[[species]]
name = "Si"
charge = 4.0

[[species]]
name = "O"
charge = -2.0

