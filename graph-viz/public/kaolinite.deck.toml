# --- adsorption / desorption ---------------------------------------------
# The adsorbing cation arrives fully solvated (l6/oh4) and rewrites every
# oxygen neighbor through a fixed case map; desorption is the inverse with
# silent skips (the legacy default: break). The legacy adsorption rate is
# a * exp(dE/RT) * exp(dmu/RT) with dE = -14.5 (Al) / -6.4 (Si), i.e.
# Arrhenius ea = +14.5 / +6.4 plus the consumes-species solution factor.

[[reactions]]
name = "adsorb-al"
center = { kind = "Al", state = ["empty"] }
guards = [{ distance = 1, state = ["@o_occ"], frozen = false, min = 1 }]
consumes = ["Al"]
rate = { arrhenius = { prefactor = 100.0, ea = 14.5 } }

[[reactions.effects]]
target = "center"
set = "l6"

[[reactions.effects]]
target = "neighbors"
select = { kind = "Oaa", state = ["Oaa.empty", "Oaa.al1"], frozen = false }
map = { empty = "al1", al1 = "hy" }

[[reactions.effects]]
target = "neighbors"
select = { kind = "Osa", state = ["Osa.empty", "Osa.al1", "Osa.si1", "Osa.sialh"], frozen = false }
map = { empty = "al1", al1 = "alhy", si1 = "sialh", sialh = "full" }

# The 406 -> 410 arm carries the lostal write: the adsorbing Al holds the
# proton, addressed by which labeled bond connects it to the oxygen.
[[reactions.effects]]
target = "neighbors"
select = { kind = "Osa", label = "a1", state = ["Osa.sial"], frozen = false }
set = "pr1"

[[reactions.effects]]
target = "neighbors"
select = { kind = "Osa", label = "a2", state = ["Osa.sial"], frozen = false }
set = "pr2"

[[reactions]]
name = "adsorb-si"
center = { kind = "Si", state = ["empty"] }
guards = [{ distance = 1, state = ["@o_occ"], frozen = false, min = 1 }]
consumes = ["Si"]
rate = { arrhenius = { prefactor = 100.0, ea = 6.4 } }

[[reactions.effects]]
target = "center"
set = "oh4"

[[reactions.effects]]
target = "neighbors"
select = { kind = "Oss", state = ["Oss.empty", "Oss.si1"], frozen = false }
map = { empty = "si1", si1 = "hy" }

[[reactions.effects]]
target = "neighbors"
select = { kind = "Osa", state = ["Osa.empty", "Osa.al1", "Osa.albr", "Osa.alhy"], frozen = false }
map = { empty = "si1", al1 = "sialh", albr = "sih", alhy = "full" }

# Desorption: only the fully solvated cation (l6 / oh4) can leave. The
# only genuinely environment-dependent rates in the legacy deck live here:
# the Check100/Check200 buckets give dE = 12*floor((x+y)/2) for Al and
# 6*(x+y) for Si (x,y as in envrn.cpp), expressed as by_count/when
# modifiers on the activation energy.

[[reactions]]
name = "desorb-al"
center = { kind = "Al", state = ["l6"] }
produces = ["Al"]
rate = { arrhenius = { prefactor = 1998.0, ea = 0.0 } }

[[reactions.modifiers]]
select = { distance = 1, state = ["Oaa.hy", "Osa.full", "Osa.alhy", "Osa.sialh", "Osa.al1", "Osa.pr1", "Osa.pr2"], frozen = false }
by_count = { dea = [0.0, 0.0, 12.0, 12.0, 24.0, 24.0, 36.0] }

[[reactions.effects]]
target = "center"
set = "empty"

[[reactions.effects]]
target = "neighbors"
select = { kind = "Oaa", state = ["*"], frozen = false }
map = { hy = "al1", al1 = "empty" }
missing = "skip"

[[reactions.effects]]
target = "neighbors"
select = { kind = "Osa", state = ["*"], frozen = false }
map = { full = "sialh", alhy = "al1", sialh = "si1", al1 = "empty", pr1 = "sial", pr2 = "sial" }
missing = "skip"

[[reactions]]
name = "desorb-si"
center = { kind = "Si", state = ["oh4"] }
produces = ["Si"]
rate = { arrhenius = { prefactor = 1998.0, ea = 6.0 } }

[[reactions.modifiers]]
select = { distance = 1, state = ["Oss.hy"], frozen = false }
by_count = { dea = [0.0, 6.0, 12.0, 18.0, 24.0] }

# The legacy Check200 x-term: any Si-OH (408) neighbor zeroes the base
# +6 bucket offset.
[[reactions.modifiers]]
select = { distance = 1, state = ["Osa.si1"], frozen = false }
when = { min = 1, dea = -6.0 }

[[reactions.effects]]
target = "center"
set = "empty"

[[reactions.effects]]
target = "neighbors"
select = { kind = "Oss", state = ["*"], frozen = false }
map = { si1 = "empty", hy = "si1" }
missing = "skip"

[[reactions.effects]]
target = "neighbors"
select = { kind = "Osa", state = ["*"], frozen = false }
map = { sih = "albr", full = "alhy", sialh = "al1", si1 = "empty" }
missing = "skip"

[simulation]
steps = 20000
seed = 42
report_every = 2000
