[[reactions.effects]]
target = "center"
set = "full"

[[reactions.effects]]
target = "neighbor"
select = { kind = "Si", state = ["@si_occ"], frozen = false }
shift = 1

[[reactions.effects]]
target = "neighbor"
select = { kind = "Al", label = "a1", state = ["@al_occ"], frozen = false }
shift = 1

# R9: reverse of R8 — a coin picks which Al LOSES a ligand; the other one
# becomes the recorded proton holder.
[[reactions]]
name = "R9-sioha-condensation"
center = { kind = "Osa", state = ["full"] }
rate = { arrhenius = { prefactor = 1.0, ea = -2.6 } }

[[reactions.branches]]
weight = 0.5
effects = [
  { target = "center", set = "pr2" },
  { target = "neighbor", select = { kind = "Si", state = ["@si_occ"], frozen = false }, shift = -1 },
  { target = "neighbor", select = { kind = "Al", label = "a1", state = ["@al_occ"], frozen = false }, shift = -1 },
]

[[reactions.branches]]
weight = 0.5
effects = [
  { target = "center", set = "pr1" },
  { target = "neighbor", select = { kind = "Si", state = ["@si_occ"], frozen = false }, shift = -1 },
  { target = "neighbor", select = { kind = "Al", label = "a2", state = ["@al_occ"], frozen = false }, shift = -1 },
]

