# --- lattice --------------------------------------------------------------
# Golden dimensions: 20 x 3 unit cells, single sheet in c (the legacy model
# never tiles c). SurfacePlane = 0: b is the open surface-normal axis;
# "fixed" freezes ragged sites in the two extreme b-rows — the legacy
# TerminateLattice EDGE rule.

[lattice]
dims = [20, 3, 1]
boundary = ["periodic", "fixed", "periodic"]

[thermo]
temperature = 8000.0    # the legacy relative-rate knob, not a physical claim

[thermo.mu]
Al = -1.0
Si = -1.0

[thermo.activity]
Al = 1.0
Si = 1.0

# --- build-time passes ----------------------------------------------------
# Reproduces the legacy build: PopulateSolid (fill 2 of 3 b-rows —
# (int)(3 * 0.7f) = 2 — plus the Si-chain guard), TerminateSurface passes
# 1-3 (as-implemented maps, dead-ternary wart included), and the
# TerminateLattice 301-revert near the frozen boundary.

# Fill depth: uniform fill made everything bulk; clear b >= 2.
[[init]]
name = "clear-above-fill-al"
center = { kind = "Al", state = ["*"] }
region = { axis = 1, min = 2 }
set = "empty"

[[init]]
name = "clear-above-fill-si"
center = { kind = "Si", state = ["*"] }
region = { axis = 1, min = 2 }
set = "empty"

[[init]]
name = "clear-above-fill-oss"
center = { kind = "Oss", state = ["*"] }
region = { axis = 1, min = 2 }
set = "empty"

[[init]]
name = "clear-above-fill-osa"
center = { kind = "Osa", state = ["*"] }
region = { axis = 1, min = 2 }
set = "empty"

[[init]]
name = "clear-above-fill-oaa"
center = { kind = "Oaa", state = ["*"] }
region = { axis = 1, min = 2 }
set = "empty"

# PopulateSolid's chain guard: a Si-O-Si bridge only exists if both Si
# sites structurally exist (bonds not cut by the open boundary) and each
# Si's Si-O-Al2 oxygen exists.
[[init]]
name = "orphan-oss-missing-si"
center = { kind = "Oss", state = ["br"] }
guards = [{ distance = 1, kind = "Si", state = ["*"], min = 0, max = 1 }]
set = "empty"

[[init]]
name = "orphan-oss-missing-osa"
center = { kind = "Oss", state = ["br"] }
guards = [{ distance = 2, kind = "Osa", state = ["*"], min = 0, max = 1 }]
set = "empty"

# TerminateSurface pass 1: demote oxygens once per missing (empty) cation
# neighbor. As-implemented legacy map (reform R3 wart preserved: 401 always
# -> 406, 406 always -> 409, regardless of which cation is missing).
[[init]]
name = "ts1-osa"
center = { kind = "Osa", state = ["br", "sih", "full", "albr", "alhy", "sial", "sialh", "si1", "al1", "pr1", "pr2"] }
foreach = { distance = 1, state = ["@cat_empty"] }
map = { br = "sial", albr = "al1", sial = "al1", al1 = "empty", si1 = "empty" }

[[init]]
name = "ts1-oss"
center = { kind = "Oss", state = ["br", "hy", "si1"] }
foreach = { distance = 1, state = ["@cat_empty"] }
map = { br = "si1", si1 = "empty" }

[[init]]
name = "ts1-oaa"
center = { kind = "Oaa", state = ["br", "hy", "al1"] }
foreach = { distance = 1, state = ["@cat_empty"] }
map = { br = "al1", al1 = "empty" }

# TerminateSurface pass 2: hydroxylate oxygens next to minimally
# coordinated (occupancy-1) cations. Here the legacy Si/Al ternaries are
# live, so the maps differ by cation kind.
[[init]]
name = "ts2-si-oss"
center = { kind = "Oss", state = ["empty", "hy", "si1"] }
foreach = { distance = 1, kind = "Si", state = ["Si.oh0"] }
map = { empty = "si1" }

[[init]]
name = "ts2-si-osa"
center = { kind = "Osa", state = ["empty", "sih", "full", "albr", "alhy", "sial", "sialh", "si1", "al1", "pr1", "pr2"] }
foreach = { distance = 1, kind = "Si", state = ["Si.oh0"] }
map = { empty = "si1", si1 = "sial", al1 = "sial", albr = "br", sial = "br" }

[[init]]
name = "ts2-al-osa"
center = { kind = "Osa", state = ["empty", "sih", "full", "albr", "alhy", "sial", "sialh", "si1", "al1", "pr1", "pr2"] }
foreach = { distance = 1, kind = "Al", state = ["Al.l0"] }
map = { empty = "al1", si1 = "sial", al1 = "albr", albr = "br", sial = "br" }

[[init]]
name = "ts2-al-oaa"
center = { kind = "Oaa", state = ["empty", "hy", "al1"] }
foreach = { distance = 1, kind = "Al", state = ["Al.l0"] }
map = { empty = "al1", al1 = "br" }

# TerminateSurface pass 3: count terminal hydroxyls into cation states.
[[init]]
name = "ts3-al"
center = { kind = "Al", state = ["@al_occ"] }
foreach = { distance = 1, state = ["Oaa.al1", "Osa.al1"] }
shift = 1

[[init]]
name = "ts3-si"
center = { kind = "Si", state = ["@si_occ"] }
foreach = { distance = 1, state = ["Oss.si1", "Osa.si1"] }
shift = 1

# TerminateLattice pass 2: revert Si-O-Si bridges whose chain touches the
# frozen boundary.
[[init]]
name = "tl-revert-frozen-si"
center = { kind = "Oss", state = ["br"] }
guards = [{ distance = 1, frozen = true, state = ["*"], min = 1 }]
set = "empty"

[[init]]
name = "tl-revert-frozen-osa"
center = { kind = "Oss", state = ["br"] }
guards = [{ distance = 2, kind = "Osa", frozen = true, state = ["*"], min = 1 }]
set = "empty"

# --- reactions ------------------------------------------------------------
# Rates: T = 8000 K, RT ~ 15.896 kcal/mol. Legacy convention: forward
# hydrolysis k+ as-is; reverse = k+ * exp(dE/RT), written here as an
# Arrhenius with NEGATIVE ea = -dE so it stays temperature-consistent.
# Forward reactions carry the corrected surface-reachability guard:
# >= 1 second-neighbor in the hydrolyzed set (frozen sites excluded).
# R10/R12 carry no guard: their centers (406/404) are themselves in the
# hydrolyzed set, so the legacy test (which scans neighbors-of-neighbors,
# center included) is trivially true there.

[[reactions]]
name = "R0-sio-si-hydrolysis"
center = { kind = "Oss", state = ["br"] }
guards = [{ distance = 2, state = ["@hydrolyzed"], frozen = false, min = 1 }]
rate = { arrhenius = { prefactor = 1.0, ea = 0.0 } }

[[reactions.effects]]
target = "center"
set = "hy"

[[reactions.effects]]
target = "neighbors"
select = { kind = "Si", state = ["@si_occ"], frozen = false }
shift = 1

[[reactions]]
name = "R1-sio-si-condensation"
center = { kind = "Oss", state = ["hy"] }
rate = { arrhenius = { prefactor = 1.0, ea = -2.6 } }

[[reactions.effects]]
target = "center"
set = "br"

[[reactions.effects]]
target = "neighbors"
select = { kind = "Si", state = ["@si_occ"], frozen = false }
shift = -1

[[reactions]]
name = "R2-sioal2-si-hydrolysis"
center = { kind = "Osa", state = ["br"] }
guards = [{ distance = 2, state = ["@hydrolyzed"], frozen = false, min = 1 }]
rate = { arrhenius = { prefactor = 1.0, ea = 0.0 } }

[[reactions.effects]]
target = "center"
set = "sih"

[[reactions.effects]]
target = "neighbor"
select = { kind = "Si", state = ["@si_occ"], frozen = false }
shift = 1

[[reactions]]
name = "R3-sioal2-si-condensation"
center = { kind = "Osa", state = ["sih"] }
rate = { arrhenius = { prefactor = 1.0, ea = -2.6 } }

[[reactions.effects]]
target = "center"
set = "br"

[[reactions.effects]]
target = "neighbor"
select = { kind = "Si", state = ["@si_occ"], frozen = false }
shift = -1

# R4: Al-side hydrolysis of the intact triple bridge; a fair coin picks
# which Al takes the proton (the legacy ran2 < 0.5 draw), recorded in the
# pr1/pr2 state split.
[[reactions]]
name = "R4-sioal2-al-hydrolysis"
center = { kind = "Osa", state = ["br"] }
guards = [{ distance = 2, state = ["@hydrolyzed"], frozen = false, min = 1 }]
rate = { arrhenius = { prefactor = 100.0, ea = 0.0 } }

[[reactions.branches]]
weight = 0.5
effects = [
  { target = "center", set = "pr1" },
  { target = "neighbor", select = { kind = "Al", label = "a1", state = ["@al_occ"], frozen = false }, shift = 1 },
]

[[reactions.branches]]
weight = 0.5
effects = [
  { target = "center", set = "pr2" },
  { target = "neighbor", select = { kind = "Al", label = "a2", state = ["@al_occ"], frozen = false }, shift = 1 },
]

[[reactions]]
name = "R5a-sioal2-al-condensation"
center = { kind = "Osa", state = ["pr1"] }
rate = { arrhenius = { prefactor = 100.0, ea = -4.8 } }

[[reactions.effects]]
target = "center"
set = "br"

[[reactions.effects]]
target = "neighbor"
select = { kind = "Al", label = "a1", state = ["@al_occ"], frozen = false }
shift = -1

[[reactions]]
name = "R5b-sioal2-al-condensation"
center = { kind = "Osa", state = ["pr2"] }
rate = { arrhenius = { prefactor = 100.0, ea = -4.8 } }

[[reactions.effects]]
target = "center"
set = "br"

[[reactions.effects]]
target = "neighbor"
select = { kind = "Al", label = "a2", state = ["@al_occ"], frozen = false }
shift = -1

[[reactions]]
name = "R6-second-stage-hydrolysis"
center = { kind = "Osa", state = ["sih"] }
guards = [{ distance = 2, state = ["@hydrolyzed"], frozen = false, min = 1 }]
rate = { arrhenius = { prefactor = 100.0, ea = 0.0 } }

[[reactions.effects]]
target = "center"
set = "full"

[[reactions.effects]]
target = "neighbors"
select = { kind = "Al", state = ["@al_occ"], frozen = false }
shift = 1

[[reactions]]
name = "R7-second-stage-condensation"
center = { kind = "Osa", state = ["full"] }
rate = { arrhenius = { prefactor = 100.0, ea = -4.8 } }

[[reactions.effects]]
target = "center"
set = "sih"

[[reactions.effects]]
target = "neighbors"
