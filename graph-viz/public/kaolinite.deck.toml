# R8: the bridged side lets go; the proton-holding Al (recorded pr1/pr2)
# keeps its ligand, the OTHER Al gains one.
[[reactions]]
name = "R8a-sioha-hydrolysis"
center = { kind = "Osa", state = ["pr1"] }
guards = [{ distance = 2, state = ["@hydrolyzed"], frozen = false, min = 1 }]
rate = { arrhenius = { prefactor = 1.0, ea = 0.0 } }

[[reactions.effects]]
target = "center"
set = "full"

[[reactions.effects]]
target = "neighbor"
select = { kind = "Si", state = ["@si_occ"], frozen = false }
shift = 1

[[reactions.effects]]
target = "neighbor"
select = { kind = "Al", label = "a2", state = ["@al_occ"], frozen = false }
shift = 1

[[reactions]]
name = "R8b-sioha-hydrolysis"
