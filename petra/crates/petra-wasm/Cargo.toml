[package]
name = "petra-wasm"
description = "WebAssembly bindings: run Petra decks live in the browser (graph-viz live mode)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
petra-core = { path = "../petra-core" }
petra-deck = { path = "../petra-deck" }
petra-io = { path = "../petra-io" }
toml = { workspace = true }
wasm-bindgen = "0.2"
# rand's std feature pulls getrandom, which needs the js backend on
# wasm32-unknown-unknown (we never draw OS entropy — seeds come from the
# deck — but it must compile).
getrandom = { version = "0.2", features = ["js"] }

# The sandbox proxy blocks the binaryen download; wasm-opt is a size
# optimization only, safe to skip.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
