[dynamics.thermo]
temperature = 773.15

# Published 57 kcal/mol bulk dehydroxylation anchor (Kodama & Brydon).
[[dynamics.rules]]
name = "dehydroxylate_pair"
center = { kind = "OH_donor", state = ["OH"] }
guards = [{ kind = "OH_acceptor", label = "oh_pair", state = ["OH"], min = 1 }]
rate = { eyring = { dh = 57.0, ds = 0.0 } }
[[dynamics.rules.modifiers]]
select = { kind = "OH_acceptor", label = "steric", state = ["O_residual"] }
by_count = { dea = [0.0, 3.0, 12.0] }
[[dynamics.rules.effects]]
target = "center"
set = "water_removed"
[[dynamics.rules.effects]]
target = "neighbor"
select = { kind = "OH_acceptor", label = "oh_pair", state = ["OH"] }
set = "O_residual"

# E2 delamination sensitivity proxy: 53.000 kcal/mol (low, 58 ± 5).
# E3a state: incomplete-input-contract; no delamination barrier emitted.
[[dynamics.rules]]
name = "delaminate_interface"
center = { kind = "Interface", state = ["bonded"] }
guards = [{ kind = "OH_acceptor", label = "delam_driver", state = ["O_residual"], min = 1 }]
rate = { eyring = { dh = 53.000, ds = 0.0 } }
[[dynamics.rules.effects]]
target = "center"
set = "delaminated"

# Lateral edge sites seed release only after their local interface delaminates.
[[dynamics.rules]]
name = "open_lateral_edge_after_delamination"
center = { kind = "Surface_gate", state = ["edge"] }
guards = [{ kind = "Interface", label = "gate_interface", state = ["delaminated"], min = 1 }]
rate = { constant = 1.0 }
[[dynamics.rules.effects]]
target = "center"
set = "open"

# The front advances only through a laterally connected chain of delaminated interfaces.
[[dynamics.rules]]
name = "advance_surface_connected_front"
center = { kind = "Surface_gate", state = ["closed"] }
guards = [
  { kind = "Interface", label = "gate_interface", state = ["delaminated"], min = 1 },
  { kind = "Surface_gate", label = "lateral_front", state = ["open"], min = 1 },
]
rate = { constant = 1.0 }
[[dynamics.rules.effects]]
target = "center"
set = "open"

# Recoil 39Ar escape is likewise a phase-2 proxy pending phase-3 NEB.
[[dynamics.rules]]
name = "escape_octahedral_Ar39"
center = { kind = "Octahedral_trap", state = ["Ar39_trapped"] }
guards = [{ kind = "K_gallery_A", label = "trap_gallery", state = ["vacant"], min = 1 }]
rate = { eyring = { dh = 64.0, ds = 0.0 } }
[[dynamics.rules.effects]]
target = "center"
set = "vacant"
[[dynamics.rules.effects]]
target = "neighbor"
select = { kind = "K_gallery_A", label = "trap_gallery", state = ["vacant"] }
set = "Ar39"

